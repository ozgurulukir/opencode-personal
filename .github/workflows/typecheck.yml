name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Build WASM
        working-directory: packages/diff-wasm
        run: bun run build:wasm

      - name: Delete stale incremental build info
        # tsgo -b caches results in *.tsbuildinfo; turbo --force does not clear
        # them, so a stale cache can mask real errors locally that only surface
        # on a clean box. CI always typechecks from scratch.
        run: find packages -name "*.tsbuildinfo" -delete

      - name: Check patches/ matches patchedDependencies
        run: bun script/check-patches.ts

      - name: Run typecheck
        run: bun typecheck
