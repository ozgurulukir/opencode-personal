name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack
      - name: Build WASM
        working-directory: packages/diff-wasm
        run: bun run build:wasm
      - run: bun typecheck

  diff-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Test JS fallback
        working-directory: packages/diff-wasm
        run: bun test
      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack
      - name: Build WASM
        working-directory: packages/diff-wasm
        run: bun run build:wasm
      - name: Verify WASM loads
        working-directory: packages/diff-wasm
        run: bun -e 'const m = await import("./pkg/opencode_diff_rs.js"); await m.default(); if (typeof m.create_two_files_patch_rs !== "function") throw new Error("missing export")'
      - name: Test WASM path
        working-directory: packages/diff-wasm
        run: bun test

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Guards the app's default `bun test` invocation (bunfig.toml preloads),
      # which is easy to break by moving preloads back into npm scripts.
      - name: App tests (default invocation)
        working-directory: packages/app
        run: bun test

  consistency:
    # Cheap structural checks that need no full install. github/ is a
    # standalone action outside the workspace, so SAFE_ATTACHMENT_REGEX is
    # intentionally duplicated between the CLI and the action — this guard
    # fails when the two copies drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun script/check-github-action.ts
