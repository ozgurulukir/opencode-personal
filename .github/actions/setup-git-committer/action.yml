name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  opencode-app-id:
    description: "OpenCode GitHub App ID"
    required: true
  opencode-app-secret:
    description: "OpenCode GitHub App private key"
    required: true
outputs:
  token:
    description: "GitHub App token"
    value: ${{ steps.apptoken.outputs.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.opencode-app-id }}
        private-key: ${{ inputs.opencode-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git credential helper
      run: |
        helper="$HOME/.git-credential-opencode-app"
        cat > "$helper" <<'SH'
        #!/usr/bin/env bash
        if [ "$1" = "get" ] && [ -n "$GIT_APP_TOKEN" ]; then
          printf "protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n" "$GIT_APP_TOKEN"
        fi
        SH
        chmod 700 "$helper"
        git config --global credential.https://github.com.helper "!$helper"
        # The token travels via the environment and is read at credential-helper
        # call time — previously it was embedded in the origin URL and persisted
        # in .git/config for the rest of the job.
        echo "GIT_APP_TOKEN=${{ steps.apptoken.outputs.token }}" >> "$GITHUB_ENV"
      shell: bash
