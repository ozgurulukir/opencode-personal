version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  - package-ecosystem: "bun"
    directory: "/github"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  - package-ecosystem: "cargo"
    directory: "/packages/diff-wasm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/.nova"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/packages/opencode/.nova"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
